name: Focals
options:
  bundleIdPrefix: com.focals
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true

packages:
  FocalsKit:
    path: FocalsKit
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: "7.10.0"
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.3.0"

targets:
  Focals:
    type: application
    platform: iOS
    sources:
      - path: Focals
        excludes:
          - "**/*.xcconfig"
          - "**/Info.plist"
          - "**/*.entitlements"
          - "Resources/Fonts/**"
    resources:
      - path: Focals/Resources/Assets.xcassets
      - path: Focals/Resources/Fonts
        buildPhase: resources
    dependencies:
      - package: FocalsKit
        product: FocalsDesign
      - package: FocalsKit
        product: FocalsModels
      - package: FocalsKit
        product: FocalsAPI
      - package: FocalsKit
        product: FocalsCache
      - package: Kingfisher
      - package: MarkdownUI
        product: MarkdownUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.focals.ios
        INFOPLIST_FILE: Focals/Info.plist
        CODE_SIGN_ENTITLEMENTS: Focals/Focals.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_VERSION: "5.9"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          OTHER_SWIFT_FLAGS: "-DDEBUG"
        Release:
          SWIFT_COMPILATION_MODE: wholemodule
    configFiles:
      Debug: Focals/Secrets.xcconfig
      Release: Focals/Secrets.xcconfig

  FocalsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FocalsTests
        excludes:
          - "Fixtures/**"
      - path: FocalsTests/Fixtures
        buildPhase: resources
        type: folder
    dependencies:
      - target: Focals
      - package: FocalsKit
        product: FocalsModels
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: "YES"

  FocalsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FocalsUITests
    dependencies:
      - target: Focals
    settings:
      base:
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: "YES"
